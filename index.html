<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
.gt {
  position: fixed; inset: 0; overflow: hidden;
  background: #08080A; color: #F2F2F4; color-scheme: dark;
  font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.gt button, .gt input, .gt select, .gt textarea { font: inherit; color: inherit; }
.gt button { border: 0; background: none; cursor: pointer; }
.gt ::-webkit-scrollbar { width: 0; height: 0; }
svg { display: block; }

/* ---------- ambient ---------- */
.lightfield { position: absolute; inset: -30%; z-index: 0; filter: blur(60px); }
.lume { position: absolute; border-radius: 50%; }
.l1 { width: 78vw; height: 78vw; left: -18vw; top: -14vh;
      background: radial-gradient(circle, rgba(255,255,255,.20), rgba(255,255,255,0) 68%); animation: drift1 26s ease-in-out infinite; }
.l2 { width: 66vw; height: 66vw; right: -20vw; top: 26vh;
      background: radial-gradient(circle, rgba(255,255,255,.11), rgba(255,255,255,0) 70%); animation: drift2 34s ease-in-out infinite; }
.l3 { width: 88vw; height: 88vw; left: -6vw; bottom: -30vh;
      background: radial-gradient(circle, rgba(255,255,255,.09), rgba(255,255,255,0) 70%); animation: drift3 40s ease-in-out infinite; }
@keyframes drift1 { 50% { transform: translate(7vw, 6vh) scale(1.14); opacity: .8 } }
@keyframes drift2 { 50% { transform: translate(-8vw, -5vh) scale(1.1); opacity: .75 } }
@keyframes drift3 { 50% { transform: translate(5vw, -7vh) scale(1.16); opacity: .8 } }
.veil { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,8,10,.30) 0%, rgba(8,8,10,.72) 46%, rgba(8,8,10,.94) 100%); }

.glass {
  background: linear-gradient(155deg, rgba(255,255,255,.11), rgba(255,255,255,.035) 62%, rgba(255,255,255,.055));
  -webkit-backdrop-filter: blur(30px) saturate(120%); backdrop-filter: blur(30px) saturate(120%);
  border: 1px solid rgba(255,255,255,.11);
  box-shadow: 0 18px 48px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16);
}

.shell { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.topbar { position: relative; z-index: 6; flex: 0 0 auto; height: 66px; margin: 12px 12px 6px; border-radius: 999px; padding: 0 12px; display: flex; align-items: center; }
.iconbtn { width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; flex: 0 0 auto;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  transition: transform .3s cubic-bezier(.32,.72,0,1), background .3s ease, opacity .3s ease; }
.iconbtn:active { transform: scale(.9); background: rgba(255,255,255,.16); }
.headtext { margin-left: 12px; min-width: 0; transition: opacity .26s ease, transform .38s cubic-bezier(.32,.72,0,1); }
.headtext.hide { opacity: 0; transform: translateX(-14px); pointer-events: none; }
.title { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 19px; letter-spacing: -.025em; line-height: 1.1; white-space: nowrap; }
.subtitle { font-size: 11px; color: #8E8E97; letter-spacing: .09em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; }

.searchpill { position: absolute; top: 12px; bottom: 12px; right: 12px; width: 42px; border-radius: 999px;
  display: flex; align-items: center; overflow: hidden;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  transition: width .5s cubic-bezier(.32,.72,0,1), background .35s ease, border-color .35s ease, opacity .3s ease; will-change: width; }
.searchpill.open { width: calc(100% - 78px); background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.22); }
.searchpill .sicon { width: 42px; height: 42px; display: grid; place-items: center; flex: 0 0 auto; transition: transform .5s cubic-bezier(.32,.72,0,1); }
.searchpill.open .sicon { transform: rotate(90deg) scale(.92); }
.searchpill input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 15.5px; padding-right: 44px;
  opacity: 0; transform: translateX(10px); user-select: text; -webkit-user-select: text;
  transition: opacity .3s ease .16s, transform .44s cubic-bezier(.32,.72,0,1) .1s; }
.searchpill.open input { opacity: 1; transform: none; }
.searchpill input::placeholder { color: #75757E; }
.clearbtn { position: absolute; right: 6px; width: 32px; height: 32px; border-radius: 999px; display: none; place-items: center;
  background: rgba(255,255,255,.10); opacity: 0; transform: scale(.6);
  transition: opacity .26s ease, transform .4s cubic-bezier(.32,.72,0,1); }
.searchpill.open .clearbtn.show { display: grid; opacity: 1; transform: none; }

/* ---------- pull-down quick panel ---------- */
.quickclip { position: absolute; left: 0; right: 0; top: 78px; bottom: 0; z-index: 5; overflow: hidden; pointer-events: none; }
.quick { position: absolute; left: 12px; right: 12px; top: 6px; border-radius: 28px; padding: 15px 15px 8px;
  pointer-events: auto; will-change: transform; transition: transform .46s cubic-bezier(.32,.72,0,1); }
.qadd { display: flex; align-items: center; gap: 9px; }
.qadd input { flex: 1; min-width: 0; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.13);
  border-radius: 999px; padding: 12px 16px; font-size: 15px; outline: none; user-select: text; -webkit-user-select: text;
  transition: border-color .3s ease, background .3s ease; }
.qadd input:focus { border-color: rgba(255,255,255,.32); background: rgba(255,255,255,.12); }
.qadd input::placeholder { color: #75757E; }
.qgo { width: 44px; height: 44px; border-radius: 999px; flex: 0 0 auto; display: grid; place-items: center; color: #08080A;
  background: linear-gradient(160deg, #FFFFFF, #C9C9D0); box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
  transition: transform .3s cubic-bezier(.32,.72,0,1), opacity .3s ease; }
.qgo:active { transform: scale(.9); }
.qnext { margin-top: 11px; padding: 12px 14px 13px; border-radius: 21px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09); }
.qmeta { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: #75757E; }
.qname { font-family: 'Outfit', sans-serif; font-size: 14.5px; font-weight: 400; letter-spacing: -.01em; margin-top: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qacts { display: flex; gap: 8px; margin-top: 12px; }
.qacts button { flex: 1; padding: 9px 4px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: #C4C4CC;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  transition: transform .3s cubic-bezier(.32,.72,0,1), background .3s ease; }
.qacts button:active { transform: scale(.93); background: rgba(255,255,255,.16); }
.qhint { font-size: 12.5px; color: #8E8E97; margin: 12px 4px 2px; line-height: 1.45; }
.qgrab { width: 34px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.22); margin: 13px auto 3px; }

/* ---------- screens ---------- */
.scroller { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 6px 12px 140px; -webkit-overflow-scrolling: touch; }
.screen { animation: screenIn .5s cubic-bezier(.32,.72,0,1) both; }
.screen.silent { animation: none; }
@keyframes screenIn { from { opacity: 0; transform: translateY(16px) scale(.985) } }

.grouphead { display: flex; align-items: center; gap: 10px; margin: 20px 6px 11px; animation: fadeUp .5s cubic-bezier(.32,.72,0,1) both; }
.grouphead span.gname { font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: #8E8E97; }
.grouphead .rule { flex: 1; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,.14), rgba(255,255,255,0)); }
.grouphead .cnt { font-size: 11px; color: #6E6E77; font-variant-numeric: tabular-nums; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } }

.datestrip { display: flex; gap: 9px; overflow-x: auto; padding: 6px 2px 10px; }
.daypill { flex: 0 0 auto; width: 58px; padding: 11px 0 10px; border-radius: 22px; text-align: center;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  transition: transform .4s cubic-bezier(.32,.72,0,1), background .38s ease, color .38s ease, border-color .38s ease; }
.daypill:active { transform: scale(.92); }
.daypill .dw { font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: #8E8E97; transition: color .35s ease; }
.daypill .dn { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 500; letter-spacing: -.03em; margin-top: 3px; font-variant-numeric: tabular-nums; }
.daypill .dots { display: flex; gap: 3px; justify-content: center; height: 5px; margin-top: 6px; }
.daypill .dots i { width: 4px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.42); transition: background .35s ease; }
.daypill.today { border-color: rgba(255,255,255,.3); }
.daypill.on { background: linear-gradient(150deg, #FFFFFF, #CFCFD6); color: #08080A; border-color: #FFFFFF; transform: scale(1.04); }
.daypill.on .dw { color: rgba(8,8,10,.6); }
.daypill.on .dots i { background: rgba(8,8,10,.5); }

.dayhead { display: flex; align-items: flex-end; gap: 10px; margin: 10px 6px 14px; }
.dayhead h2 { font-family: 'Outfit', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -.035em; margin: 0; line-height: 1.05; }
.dayhead span { font-size: 12px; color: #8E8E97; padding-bottom: 3px; }

.tline { display: flex; gap: 10px; align-items: flex-start; }
.tgut { width: 54px; flex: 0 0 auto; text-align: right; padding-top: 17px; font-size: 11.5px; color: #8E8E97;
  font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.tgut b { display: block; font-weight: 500; color: #E6E6EA; font-size: 12.5px; }
.tgrow { flex: 1; min-width: 0; }
.nowline { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; animation: fadeUp .5s cubic-bezier(.32,.72,0,1) both; }
.nowline .lbl { width: 54px; text-align: right; font-size: 11px; color: #FFFFFF; font-variant-numeric: tabular-nums; }
.nowline .bar { flex: 1; height: 1px; background: linear-gradient(90deg, #FFFFFF, rgba(255,255,255,0)); }
.nowline .knob { width: 7px; height: 7px; border-radius: 999px; background: #fff; box-shadow: 0 0 10px rgba(255,255,255,.8); }

/* ---------- rows ---------- */
.rowwrap { position: relative; margin-bottom: 10px; border-radius: 24px; overflow: hidden; touch-action: pan-y;
  animation: rowIn .55s cubic-bezier(.32,.72,0,1) both; }
.silent .rowwrap { animation: none; }
@keyframes rowIn { from { opacity: 0; transform: translateY(16px) scale(.97) } }
.rowback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.rowback span { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #fff; opacity: 0;
  transform: scale(.8); transition: opacity .2s ease, transform .3s cubic-bezier(.32,.72,0,1); }
.card { position: relative; border-radius: 24px; padding: 14px 15px 14px 19px; display: flex; gap: 13px; align-items: flex-start;
  will-change: transform; transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .3s ease; }
.card.done { opacity: .42; }
.rail { position: absolute; left: 8px; top: 14px; bottom: 14px; width: 2.5px; border-radius: 3px; background: rgba(255,255,255,.10); overflow: hidden; }
.rail i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 3px; display: block; transition: height .8s cubic-bezier(.32,.72,0,1); }
.tick { width: 26px; height: 26px; border-radius: 999px; flex: 0 0 auto; margin-top: 2px; border: 1.5px solid rgba(255,255,255,.32);
  display: grid; place-items: center; color: #08080A; transition: transform .34s cubic-bezier(.32,.72,0,1), background .3s ease, border-color .3s ease; }
.tick:active { transform: scale(.84); }
.tick.on { background: #FFFFFF; border-color: #FFFFFF; }
.tick svg { animation: pop .38s cubic-bezier(.32,.72,0,1) both; }
@keyframes pop { from { transform: scale(0) rotate(-25deg); opacity: 0 } }
.body { flex: 1; min-width: 0; }
.tname { font-family: 'Outfit', sans-serif; font-size: 15.5px; font-weight: 400; letter-spacing: -.012em; line-height: 1.35; word-break: break-word; }
.card.done .tname { text-decoration: line-through; }
.tnote { font-size: 13px; color: #8E8E97; margin-top: 4px; line-height: 1.45; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); color: #B4B4BC;
  font-variant-numeric: tabular-nums; transition: background .3s ease, color .3s ease; }
.chip.warn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3); color: #FFFFFF; }
.pdot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; display: inline-block; }

/* steps on a card */
.sprog { height: 3px; border-radius: 3px; background: rgba(255,255,255,.10); margin-top: 10px; overflow: hidden; }
.sprog i { display: block; height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, rgba(255,255,255,.5), #FFFFFF); transition: width .65s cubic-bezier(.32,.72,0,1); }
.chip.stepchip.on { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.3); color: #FFFFFF; }
.steps { margin-top: 12px; display: flex; flex-direction: column; gap: 1px; animation: fadeUp .38s cubic-bezier(.32,.72,0,1) both; }
.steprow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 2px;
  font-size: 13.5px; color: #C4C4CC; transition: opacity .3s ease; }
.sbox { width: 17px; height: 17px; border-radius: 6px; flex: 0 0 auto; display: grid; place-items: center; color: #08080A;
  border: 1.4px solid rgba(255,255,255,.3); transition: background .28s ease, border-color .28s ease, transform .3s cubic-bezier(.32,.72,0,1); }
.steprow:active .sbox { transform: scale(.84); }
.steprow.done .sbox { background: #FFFFFF; border-color: #FFFFFF; }
.steprow.done span:last-child { text-decoration: line-through; color: #6E6E77; }
.card.justdone { animation: donepop .55s cubic-bezier(.32,.72,0,1); }
@keyframes donepop { 40% { transform: scale(1.025); border-color: rgba(255,255,255,.45); } }

/* steps inside the editor */
.estep { display: flex; align-items: center; gap: 11px; padding: 9px 13px; border-radius: 999px; margin-bottom: 7px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.09);
  transition: background .3s ease, opacity .3s ease; }
.estep.done { opacity: .5; }
.estep.done .etxt { text-decoration: line-through; }
.estep .etxt { flex: 1; min-width: 0; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sbox2 { width: 20px; height: 20px; border-radius: 7px; flex: 0 0 auto; display: grid; place-items: center; color: #08080A;
  border: 1.5px solid rgba(255,255,255,.32); transition: background .28s ease, border-color .28s ease, transform .3s cubic-bezier(.32,.72,0,1); }
.sbox2:active { transform: scale(.84); }
.estep.done .sbox2 { background: #FFFFFF; border-color: #FFFFFF; }
.sdel { width: 26px; height: 26px; border-radius: 999px; flex: 0 0 auto; display: grid; place-items: center; color: #75757E;
  transition: color .3s ease, transform .3s cubic-bezier(.32,.72,0,1); }
.sdel:active { transform: scale(.85); color: #fff; }

/* hint that the top bar pulls down */
.pullhint { position: absolute; left: 50%; top: 80px; z-index: 4; width: 36px; height: 4px; margin-left: -18px;
  border-radius: 4px; background: rgba(255,255,255,.22); pointer-events: none; transition: opacity .4s ease; }

/* ---------- focus ---------- */
.panel { border-radius: 26px; padding: 18px; margin-bottom: 10px; animation: fadeUp .55s cubic-bezier(.32,.72,0,1) both; }
.silent .panel { animation: none; }
.ringwrap { display: flex; align-items: center; gap: 18px; }
.ringwrap svg { flex: 0 0 auto; }
.ringwrap .txt { min-width: 0; }
.ringwrap .stat { font-family: 'Outfit', sans-serif; font-size: 27px; font-weight: 600; letter-spacing: -.04em; line-height: 1;
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.ringwrap .stat span { font-size: 17px; font-weight: 500; color: #8E8E97; letter-spacing: -.02em; }
.ringwrap .lbl { font-size: 12.5px; color: #8E8E97; margin-top: 7px; line-height: 1.4; }
.ringtxt { font-family: 'Outfit', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: -.03em; fill: #FFFFFF; }
.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.statbox { border-radius: 22px; padding: 15px 16px; text-align: left; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.09);
  transition: transform .4s cubic-bezier(.32,.72,0,1), background .3s ease; }
.statbox:active { transform: scale(.97); }
.statbox b { font-family: 'Outfit', sans-serif; display: block; font-size: 27px; font-weight: 600; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.statbox small { display: block; font-size: 10.5px; color: #8E8E97; margin-top: 3px; letter-spacing: .13em; text-transform: uppercase; }
.wk { display: block; width: 100%; height: auto; margin-top: 4px; overflow: visible; }
.wk .gl { stroke: rgba(255,255,255,.07); stroke-width: 1; }
.wk .gl.base { stroke: rgba(255,255,255,.18); }
.wk .wkd { font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: .9px; fill: #75757E; }
.wk .wkd.on { fill: #FFFFFF; }
.wk .wkc { font-family: 'Inter Tight', sans-serif; font-size: 10.5px; fill: #C4C4CC; }
.wk .wkc.zero { fill: #43434A; }
.nextcard { display: flex; align-items: center; gap: 13px; }
.nextcard .tm { font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.nextcard svg { flex: 0 0 auto; color: #75757E; }
.plabel { display: flex; align-items: baseline; gap: 12px; font-family: 'Outfit', sans-serif; font-size: 11px; font-weight: 500;
  letter-spacing: .13em; text-transform: uppercase; color: #8E8E97; margin: 0 0 10px; white-space: nowrap; }
.plabel .rt { margin-left: auto; letter-spacing: .08em; color: #6E6E77; font-variant-numeric: tabular-nums; }
.panel:last-child { margin-bottom: 0; }

/* ---------- fab ---------- */
.fab { position: absolute; right: 18px; bottom: 26px; z-index: 6; width: 158px; height: 58px; padding: 0; border-radius: 999px;
  display: flex; align-items: center; justify-content: center; gap: 9px; overflow: hidden;
  font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15.5px; letter-spacing: -.01em; color: #FFFFFF;
  background: linear-gradient(150deg, rgba(255,255,255,.30), rgba(255,255,255,.10) 58%, rgba(255,255,255,.18));
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);

];

const REPEATS = { daily: "Every day", weekdays: "Weekdays", weekly: "Every week", monthly: "Every month" };

/* advance a due date to its next occurrence, skipping any that already passed */
function nextDue(iso, rep) {
  const d = new Date(iso);
  const step = () => {
    if (rep === "daily") d.setDate(d.getDate() + 1);
    else if (rep === "weekdays") { do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6); }
    else if (rep === "weekly") d.setDate(d.getDate() + 7);
    else if (rep === "monthly") d.setMonth(d.getMonth() + 1);
  };
  step();
  let guard = 0;
  while (d.getTime() < Date.now() && guard++ < 400) step();
  return d.toISOString();
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
function fmtDay(d) {
  const n = dayDiff(d, new Date());
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  return d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
}
function toLocalInput(iso) {
  if (!iso) return "";
  const d = new Date(iso), p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function countdown(ms) {
  if (ms <= 0) return "overdue";
  const m = Math.floor(ms / 60000);
  if (m < 60) return "in " + m + "m";
  const h = Math.floor(m / 60);
  if (h < 24) return "in " + h + "h " + (m % 60) + "m";
  return "in " + Math.floor(h / 24) + "d";
}
function byTime(a, b) {
  if (a.due && b.due) return new Date(a.due) - new Date(b.due);
  if (a.due) return -1;
  if (b.due) return 1;
  return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
}
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ================================================================== */
/*  state                                                              */
/* ================================================================== */
const ALERT_DEFAULTS = {
  overdue: false, highOnly: false, quiet: false, quietFrom: "22:00", quietTo: "07:00"
};
const PREF_DEFAULTS = {
  glow: true, motion: true, hideDone: false, startView: "today"
};
const state = {
  tasks: [], view: "today", query: "", searching: false, drawer: false,
  perm: "default", defaultRemind: 15, selDate: startOfDay(new Date()).getTime(), loaded: false,
  alerts: Object.assign({}, ALERT_DEFAULTS), prefs: Object.assign({}, PREF_DEFAULTS), lastBrief: 0,
  expanded: {}
};

function applyPrefs() {
  const p = state.prefs;
  app.classList.toggle("noglow", !p.glow);
  app.classList.toggle("still", !p.motion);
}

const $ = (id) => document.getElementById(id);
const app = $("app"), scroller = $("scroller"), drawer = $("drawer"), scrim = $("scrim");

/* -------- storage -------- */
/* Writes go to every backend available, so a task can't vanish because one of
   them is missing here; reads take the first backend that answers. */
const KEY = "glasstasks:v1";
const store = {
  async get() {
    if (window.storage && window.storage.get) {
      try { const r = await window.storage.get(KEY); if (r && r.value != null) return r.value; } catch (e) {}
    }
    try { const v = window.localStorage.getItem(KEY); if (v != null) return v; } catch (e) {}
    return null;
  },
  async set(v) {
    if (window.storage && window.storage.set) { try { await window.storage.set(KEY, v); } catch (e) {} }
    try { window.localStorage.setItem(KEY, v); } catch (e) {}
  }
};

async function load() {
  try {
    const d = JSON.parse(await store.get());
    state.tasks = d.tasks || [];
    if (typeof d.defaultRemind === "number") state.defaultRemind = d.defaultRemind;
    if (d.alerts) state.alerts = Object.assign({}, ALERT_DEFAULTS, d.alerts);
    if (d.prefs) state.prefs = Object.assign({}, PREF_DEFAULTS, d.prefs);
    if (d.lastBrief) state.lastBrief = d.lastBrief;
    state.view = state.prefs.startView === "last" ? (d.view || "today") : state.prefs.startView;
  } catch (e) { /* first run */ }
  state.loaded = true;
  try { if ("Notification" in window) state.perm = Notification.permission; } catch (e) {}
  applyPrefs();
  renderAll();
}

function snapshot() {
  return JSON.stringify({
    tasks: state.tasks, defaultRemind: state.defaultRemind, view: state.view,
    alerts: state.alerts, prefs: state.prefs, lastBrief: state.lastBrief
  });
}

let saveTimer = null, dirty = false;
function save() {
  if (!state.loaded) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
function flush() {
  if (!state.loaded || !dirty) return;
  dirty = false;
  clearTimeout(saveTimer);
  store.set(snapshot());
}
/* leaving the app must never lose the last edit */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
window.addEventListener("pagehide", flush);
window.addEventListener("blur", flush);
setInterval(flush, 5000);

/* ================================================================== */
/*  derived                                                            */
/* ================================================================== */
function counts() {
  const now = new Date(), open = state.tasks.filter((t) => !t.done);
  return {
    all: open.length,
    today: open.filter((t) => t.due && dayDiff(new Date(t.due), now) === 0).length,
    upcoming: open.filter((t) => t.due && new Date(t.due) >= now).length,
    overdue: open.filter((t) => t.due && new Date(t.due) < now).length,
    high: open.filter((t) => t.priority === "high").length,
    done: state.tasks.filter((t) => t.done).length
  };
}
function searched() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.tasks;
  return state.tasks.filter((t) => (t.title + " " + (t.note || "")).toLowerCase().indexOf(q) > -1);
}

/* ================================================================== */
/*  fragments                                                          */
/* ================================================================== */
function rowHTML(t, i, hideDate) {
  const pr = PRIORITIES[t.priority] || PRIORITIES.low;
  const due = t.due ? new Date(t.due) : null;
  const now = Date.now();
  const overdue = due && !t.done && due.getTime() < now;
  let fill = 0;
  if (due && !t.done) {
    const left = due.getTime() - now;
    fill = left <= 0 ? 100 : Math.max(5, Math.min(100, (1 - left / 86400000) * 100));
  }
  const steps = t.steps || [];
  const sdone = steps.filter((x) => x.done).length;
  const shown = state.expanded[t.id];
  let meta = '<span class="chip" style="background:' + pr.fill + ';color:' + pr.tone + '">' +
    '<i class="pdot" style="opacity:' + pr.dot + '"></i> ' + pr.label + '</span>';
  if (steps.length) meta += '<button class="chip stepchip' + (shown ? " on" : "") + '" data-act="steps">' +
    ico("steps", 11) + ' ' + sdone + '/' + steps.length + '</button>';
  if (t.repeat) meta += '<span class="chip">' + ico("repeat", 11) + ' ' + REPEATS[t.repeat] + '</span>';
  if (due && !hideDate) meta += '<span class="chip' + (overdue ? " warn" : "") + '">' + ico("clock", 11) + ' ' +
    esc(fmtDay(due)) + ' &middot; ' + esc(fmtTime(due)) + '</span>';
  if (due && !t.done) meta += '<span class="chip' + (overdue ? " warn" : "") + '">' + countdown(due.getTime() - now) + '</span>';
  if (due && !t.done) meta += '<span class="chip">' + ico("bell", 11) + ' ' +
    (t.remind === 0 ? "on time" : (t.remind < 60 ? t.remind + "m" : t.remind / 60 + "h") + " early") + '</span>';

  return '<div class="rowwrap" data-id="' + t.id + '" style="animation-delay:' + Math.min(i * 45, 320) + 'ms">' +
    '<div class="rowback">' +
      '<span class="ractL">' + ico("checkCircle", 17) + ' ' + (t.done ? "Reopen" : "Complete") + '</span>' +
      '<span class="ractR">Delete ' + ico("trash", 17) + '</span>' +
    '</div>' +
    '<div class="card glass' + (t.done ? " done" : "") + '">' +
      '<div class="rail"><i style="height:' + fill + '%;background:' + pr.tone + ';opacity:' + (t.done ? .3 : 1) + '"></i></div>' +
      '<button class="tick' + (t.done ? " on" : "") + '" data-act="toggle" aria-label="Complete task">' +
        (t.done ? ico("check", 15, 3.2) : "") + '</button>' +
      '<div class="body" data-act="edit">' +
        '<div class="tname">' + esc(t.title) + '</div>' +
        (t.note ? '<div class="tnote">' + esc(t.note) + '</div>' : '') +
        (steps.length ? '<div class="sprog"><i style="width:' + Math.round((sdone / steps.length) * 100) + '%"></i></div>' : '') +
        '<div class="meta">' + meta + '</div>' +
        (shown && steps.length ? '<div class="steps">' + steps.map((st) =>
          '<button class="steprow' + (st.done ? " done" : "") + '" data-act="step" data-sid="' + st.id + '">' +
          '<span class="sbox">' + (st.done ? ico("check", 11, 3.4) : "") + '</span><span>' + esc(st.text) + '</span></button>'
        ).join("") + '</div>' : '') +
      '</div>' +
    '</div></div>';
}
const rowsHTML = (items, off, hideDate) => items.map((t, i) => rowHTML(t, i + (off || 0), hideDate)).join("");
const emptyHTML = (title, line) => '<div class="empty"><div class="emptyicon">' + ico("sparkles", 26) +
  '</div><h3>' + title + '</h3><p>' + line + '</p></div>';
const headHTML = (name, count, accent) => '<div class="grouphead"><span class="gname"' +
  (accent ? ' style="color:#fff"' : '') + '>' + esc(name) + '</span><span class="cnt">' + count + '</span><div class="rule"></div></div>';

/* ================================================================== */
/*  screens                                                            */
/* ================================================================== */
function todayScreen() {
  const tasks = searched();
  const base = startOfDay(new Date());
  const days = [];
  for (let i = -2; i < 19; i++) { const d = new Date(base); d.setDate(d.getDate() + i); days.push(d); }
  const forDay = (d) => tasks.filter((t) => t.due && dayDiff(new Date(t.due), d) === 0);

  let strip = '<div class="datestrip">';
  days.forEach((d) => {
    const n = forDay(d).filter((t) => !t.done).length;
    const on = d.getTime() === state.selDate;
    let dots = "";
    for (let i = 0; i < Math.min(n, 3); i++) dots += "<i></i>";
    strip += '<button class="daypill' + (on ? " on" : "") + (dayDiff(d, new Date()) === 0 ? " today" : "") +
      '" data-act="day" data-day="' + d.getTime() + '">' +
      '<div class="dw">' + d.toLocaleDateString([], { weekday: "short" }).slice(0, 3) + '</div>' +
      '<div class="dn">' + d.getDate() + '</div><div class="dots">' + dots + '</div></button>';
  });
  strip += "</div>";

  const selDate = new Date(state.selDate);
  const list = forDay(selDate).sort(byTime);
  const open = list.filter((t) => !t.done).length;
  const isToday = dayDiff(selDate, new Date()) === 0;
  const now = new Date();
  const nowIdx = isToday ? list.findIndex((t) => new Date(t.due) > now) : -1;
  const nowMark = '<div class="nowline"><div class="lbl">' + fmtTime(now) + '</div><div class="knob"></div><div class="bar"></div></div>';

  let out = strip + '<div class="dayhead"><h2>' + fmtDay(selDate) + '</h2><span>' +
    selDate.toLocaleDateString([], { month: "long", day: "numeric" }) + ' &middot; ' + open + ' open</span></div>';

  if (!list.length) out += emptyHTML("Nothing on this day", "Pick another date, or add a task and set its time.");
  else {
    list.forEach((t, i) => {
      if (i === nowIdx) out += nowMark;
      out += '<div class="tline"><div class="tgut"><b>' + fmtTime(new Date(t.due)) + '</b>' +
        (t.done ? "done" : PRIORITIES[t.priority].label.toLowerCase()) + '</div>' +
        '<div class="tgrow">' + rowHTML(t, i, true) + '</div></div>';
    });
    if (isToday && nowIdx === -1) out += nowMark;
  }
  return out;
}

function upcomingScreen() {
  const tasks = searched(), now = new Date();
  const list = tasks.filter((t) => !t.done && t.due && new Date(t.due) >= now).sort(byTime);
  const undated = tasks.filter((t) => !t.done && !t.due);
  if (!list.length && !undated.length) return emptyHTML("The road ahead is clear", "Nothing scheduled after right now.");
  const groups = [];
  list.forEach((t) => {
    const key = fmtDay(new Date(t.due));
    const g = groups.filter((x) => x.key === key)[0];
    if (g) g.items.push(t); else groups.push({ key: key, items: [t] });
  });
  let out = "";
  groups.forEach((g, gi) => { out += headHTML(g.key, g.items.length) + rowsHTML(g.items, gi); });
  if (undated.length) out += headHTML("No date", undated.length) + rowsHTML(undated);
  return out;
}

function allScreen() {
  const tasks = searched(), now = new Date();
  const g = { Overdue: [], Today: [], Tomorrow: [], Later: [], "No date": [], Completed: [] };
  tasks.slice().sort(byTime).forEach((t) => {
    if (t.done) return g.Completed.push(t);
    if (!t.due) return g["No date"].push(t);
    const d = new Date(t.due);
    if (d < now) return g.Overdue.push(t);
    const n = dayDiff(d, now);
    if (n === 0) return g.Today.push(t);
    if (n === 1) return g.Tomorrow.push(t);
    g.Later.push(t);
  });
  if (state.prefs.hideDone) g.Completed = [];
  const keys = Object.keys(g).filter((k) => g[k].length);
  if (!keys.length) return emptyHTML("Nothing here yet", "Add a task and set the time it needs to be done.");
  return keys.map((k, gi) => headHTML(k, g[k].length, k === "Overdue") + rowsHTML(g[k], gi)).join("");
}

function priorityScreen() {
  const open = searched().filter((t) => !t.done).sort(byTime);
  if (!open.length) return emptyHTML("Nothing open", "Every task is done. Add another when you're ready.");
  return ["high", "medium", "low"].map((k, gi) => {
    const items = open.filter((t) => t.priority === k);
    if (!items.length) return "";
    return '<div class="grouphead"><i class="pdot" style="opacity:' + PRIORITIES[k].dot + ';color:#fff"></i>' +
      '<span class="gname">' + PRIORITIES[k].label + '</span><span class="cnt">' + items.length +
      '</span><div class="rule"></div></div>' + rowsHTML(items, gi);
  }).join("");
}

function doneScreen() {
  const items = searched().filter((t) => t.done).sort((a, b) => (b.created || 0) - (a.created || 0));
  if (!items.length) return emptyHTML("Nothing finished yet", "Completed tasks collect here so you can look back.");
  return headHTML("Completed", items.length) + rowsHTML(items) +
    '<button class="ghost" data-act="clearDone">Clear all ' + items.length + '</button>';
}

function focusScreen() {
  const c = counts();
  const pct = state.tasks.length ? Math.round((c.done / state.tasks.length) * 100) : 0;
  const base = startOfDay(new Date());
  const week = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(base); d.setDate(d.getDate() + i);
    week.push({ d: d, n: state.tasks.filter((t) => !t.done && t.due && dayDiff(new Date(t.due), d) === 0).length });
  }
  const peak = Math.max(1, Math.max.apply(null, week.map((w) => w.n)));
  const next = state.tasks.filter((t) => !t.done && t.due).sort(byTime)[0];

  let out = '<div class="panel glass" style="animation-delay:40ms"><div class="ringwrap">' +
    '<svg width="80" height="80" viewBox="0 0 80 80">' +
    '<circle cx="40" cy="40" r="32" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"></circle>' +
    '<circle cx="40" cy="40" r="32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" ' +
    'stroke-dasharray="' + (pct / 100) * 201 + ' 201" transform="rotate(-90 40 40)"></circle>' +
    '<text class="ringtxt" x="40" y="40" dy=".36em" text-anchor="middle">' + pct + '%</text></svg>' +
    '<div class="txt"><div class="stat">' + c.done + '<span> / ' + state.tasks.length + '</span></div>' +
    '<div class="lbl">tasks complete<br>' + c.all + ' still open</div></div>' +
    '</div></div>';

  out += '<div class="statgrid">' +
    '<button class="statbox" data-act="go" data-view="today"><b>' + c.today + '</b><small>Due today</small></button>' +
    '<button class="statbox" data-act="go" data-view="all"><b>' + c.overdue + '</b><small>Overdue</small></button>' +
    '<button class="statbox" data-act="go" data-view="priority"><b>' + c.high + '</b><small>High priority</small></button>' +
    '<button class="statbox" data-act="go" data-view="upcoming"><b>' + c.upcoming + '</b><small>Upcoming</small></button></div>';

  // chart is drawn as one SVG so every bar, gridline and label sits on exact coordinates
  const VW = 280, COL = VW / 7, TRACK = 80, BASE = 80, BW = 18;
  let g = '<defs><linearGradient id="bargrad" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>' +
    '<stop offset="100%" stop-color="#FFFFFF" stop-opacity=".38"/></linearGradient></defs>';
  g += '<rect x="' + (COL - 30) / 2 + '" y="-6" width="30" height="' + (TRACK + 12) + '" rx="12" fill="rgba(255,255,255,.05)"/>';
  [0, TRACK / 2, BASE].forEach(function (y, i) {
    g += '<line class="gl' + (i === 2 ? " base" : "") + '" x1="0" y1="' + y + '" x2="' + VW + '" y2="' + y + '" shape-rendering="crispEdges"/>';
  });
  week.forEach(function (w, i) {
    const cx = i * COL + COL / 2;
    const h = w.n ? Math.round((w.n / peak) * (TRACK - 14)) + 14 : 3;
    g += '<rect x="' + (cx - BW / 2) + '" y="' + (BASE - h) + '" width="' + BW + '" height="' + h + '" rx="' +
      Math.min(BW / 2, h / 2) + '" fill="' + (w.n ? 'url(#bargrad)' : 'rgba(255,255,255,.10)') + '"/>';
    g += '<text class="wkd' + (i === 0 ? " on" : "") + '" x="' + cx + '" y="97" text-anchor="middle">' +
      w.d.toLocaleDateString([], { weekday: "short" }).slice(0, 2).toUpperCase() + '</text>';
    g += '<text class="wkc' + (w.n ? "" : " zero") + '" x="' + cx + '" y="112" text-anchor="middle">' + w.n + '</text>';
  });
  const load = week.reduce(function (s2, w) { return s2 + w.n; }, 0);
  out += '<div class="panel glass" style="animation-delay:110ms">' +
    '<div class="plabel"><span>Next 7 days</span><span class="rt">' + load + ' due</span></div>' +
    '<svg class="wk" viewBox="0 0 ' + VW + ' 116" role="img" aria-label="Tasks due over the next seven days">' +
    g + '</svg></div>';

  const steppy = state.tasks.filter((t) => !t.done && t.steps && t.steps.length);
  if (steppy.length) {
    const tot = steppy.reduce((n, t) => n + t.steps.length, 0);
    const dn = steppy.reduce((n, t) => n + t.steps.filter((x) => x.done).length, 0);
    out += '<div class="panel glass" style="animation-delay:150ms">' +
      '<div class="plabel"><span>Steps in progress</span><span class="rt">' + dn + ' / ' + tot + '</span></div>' +
      '<div class="sprog" style="margin-top:0"><i style="width:' + Math.round((dn / tot) * 100) + '%"></i></div>' +
      '<div class="tnote" style="margin-top:10px">' + steppy.length + ' task' + (steppy.length > 1 ? "s" : "") +
      ' broken into steps</div></div>';
  }
  out += '<div class="panel glass" style="animation-delay:180ms"><div class="plabel">Next up</div>';
  if (next) {
    out += '<div class="nextcard" data-act="go" data-view="today"><div class="tm">' + fmtTime(new Date(next.due)) + '</div>' +
      '<div style="flex:1;min-width:0"><div class="tname" style="font-size:15px;overflow:hidden;' +
      'text-overflow:ellipsis;white-space:nowrap">' + esc(next.title) + '</div>' +
      '<div class="tnote" style="margin-top:2px">' + fmtDay(new Date(next.due)) + ' &middot; ' +
      countdown(new Date(next.due) - Date.now()) + '</div></div>' + ico("chevron", 18) + '</div>';
  } else out += '<div class="tnote" style="margin:0">Nothing scheduled. Add a task to fill the day.</div>';
  return out + "</div>";
}

  const sw = (grp, key, title, sub) =>
    '<button class="srow' + (grp[key] ? " on" : "") + '" data-act="' + (grp === a ? "alert" : "pref") + '" data-key="' + key + '">' +

  out += '<div class="label">Appearance</div>';
  out += sw(p, "glow", "Ambient glow", "The drifting light behind the glass");

    '<button class="ghost" data-act="backup">Copy a backup to the clipboard</button>' +
    (c.done ? '<button class="ghost" data-act="clearDone">Clear ' + c.done + ' completed</button>' : '');
  return out;
}

/* ================================================================== */
/*  render                                                             */
/* ================================================================== */
function renderScreen(silent) {
  const top = silent ? scroller.scrollTop : 0;
  const map = {
    focus: focusScreen, today: todayScreen, upcoming: upcomingScreen,
    all: allScreen, priority: priorityScreen, done: doneScreen, settings: settingsScreen
  };
  scroller.innerHTML = '<div class="screen' + (silent ? " silent" : "") + '">' + map[state.view]() + "</div>";
  scroller.scrollTop = top;
  if (typeof syncFab === "function") syncFab();
}

function renderHead() {
  const c = counts();
  const v = VIEWS.filter((x) => x.k === state.view)[0];
  const subs = {
    focus: new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }),
    today: c.today + " due today",
    upcoming: c.upcoming + " ahead",

function toggleTask(id) {
  const t = state.tasks.filter((x) => x.id === id)[0];
  if (!t) return;
  let rolled = null;
  if (!t.done && t.repeat && t.due) {
    /* a repeating task never finishes - it schedules its next run */
    t.due = nextDue(t.due, t.repeat);
    t.notified = false; t.nudged = false; t.held = false;
    t.runs = (t.runs || 0) + 1;
    (t.steps || []).forEach((st) => { st.done = false; });
    rolled = t;
  } else {
    t.done = !t.done;
  }
  save();
  renderHead(); renderNav(); renderScreen(true);
  if (rolled) showToast("Done \u00b7 next on " + fmtDay(new Date(rolled.due)),
    rolled.title + " returns at " + fmtTime(new Date(rolled.due)) + ".");
  else if (t.done) {
    const el = document.querySelector('.rowwrap[data-id="' + id + '"] .card');
    if (el) el.classList.add("justdone");
  }
}
function removeTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  save(); renderHead(); renderNav(); renderScreen(true);
}
function clearDone() {
  state.tasks = state.tasks.filter((t) => !t.done);
  save(); renderAll();
}

scroller.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const kind = act.dataset.act;
  const wrap = act.closest(".rowwrap");
  if (kind === "toggle") return toggleTask(wrap.dataset.id);
  if (kind === "edit") return openSheet(state.tasks.filter((t) => t.id === wrap.dataset.id)[0]);
  if (kind === "steps") {
    state.expanded[wrap.dataset.id] = !state.expanded[wrap.dataset.id];
    renderScreen(true); return;
  }
  if (kind === "step") {
    const t = state.tasks.filter((x) => x.id === wrap.dataset.id)[0];
    const st = (t.steps || []).filter((x) => x.id === act.dataset.sid)[0];
    if (st) { st.done = !st.done; save(); renderScreen(true); }
    return;
  }
  if (kind === "day") { state.selDate = Number(act.dataset.day); renderScreen(true); return; }
  if (kind === "go") { state.view = act.dataset.view; save(); renderAll(); return; }
  if (kind === "clearDone") return clearDone();
  if (kind === "perm") return askPermission();
  if (kind === "alert") {
    state.alerts[act.dataset.key] = !state.alerts[act.dataset.key];
    save(); renderScreen(true); return;
  }
  if (kind === "pref") {
    state.prefs[act.dataset.key] = !state.prefs[act.dataset.key];
    applyPrefs(); save(); renderScreen(true); return;
  }
  if (kind === "start") { state.prefs.startView = act.dataset.v; save(); renderScreen(true); return; }
  if (kind === "backup") {
    const text = snapshot();
    try {
      navigator.clipboard.writeText(text).then(
        () => showToast("Backup copied", state.tasks.length + " tasks copied as text \u2014 paste it somewhere safe."),
        () => showToast("Couldn't copy", "This browser blocked clipboard access.")
      );
    } catch (e) { showToast("Couldn't copy", "This browser blocked clipboard access."); }
    return;
  }
});

let toastTimer = null;
function showToast(title, body) {
  $("toastHost").innerHTML = '<div class="toast glass">' + ico("bell", 18) +
    '<div><b>' + esc(title) + '</b><p>' + esc(body) + '</p></div></div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => ($("toastHost").innerHTML = ""), 5200);
}
async function askPermission() {
  if (!("Notification" in window)) {
    showToast("Not available here", "This browser has no notification support \u2014 alerts appear in the app.");
    return;
  }
  if (Notification.permission === "granted") {
    showToast("Reminders are already on", "Turn them off in your browser's settings for this site.");
    return;
  }
  if (Notification.permission === "denied") {
    showToast("Notifications are blocked", "Allow them in your browser's settings \u2014 alerts stay in the app meanwhile.");
    return;
  }
  try {
    const p = await Notification.requestPermission();
    state.perm = p;
    renderScreen(true);
    if (p === "granted") showToast("Reminders are on", "You'll get a heads-up before each task starts.");
    else showToast("Reminders stay in the app", "Allow notifications later for lock-screen alerts.");
  } catch (e) { showToast("Blocked by the browser", "Alerts will still appear inside the app."); }
}

function inQuiet(d) {
  const a = state.alerts;
  if (!a.quiet) return false;
  const mins = (v) => { const x = String(v).split(":"); return Number(x[0]) * 60 + Number(x[1]); };
  const cur = d.getHours() * 60 + d.getMinutes(), f = mins(a.quietFrom), t = mins(a.quietTo);
  return f <= t ? (cur >= f && cur < t) : (cur >= f || cur < t);
}

function deliver(title, body) {
  try {
    if ("Notification" in window && Notification.permission === "granted") new Notification(title, { body: body });
    else showToast(title, body);
  } catch (e) { showToast(title, body); }
}

function fireDue() {
  const nowD = new Date(), now = nowD.getTime(), a = state.alerts, quiet = inQuiet(nowD);
  let changed = false;

  state.tasks.forEach((t) => {
    if (t.done || !t.due) return;
    const dueMs = new Date(t.due).getTime();
    const at = dueMs - (t.remind || 0) * 60000;
    const muted = a.highOnly && t.priority !== "high";

    if (!t.notified && now >= at) {
      if (muted) { t.notified = true; changed = true; }
      else if (quiet) { if (!t.held) { t.held = true; changed = true; } }
      else if (now < dueMs + (t.held ? 86400000 : 300000)) {
        deliver(t.title, PRIORITIES[t.priority].label + " priority \u00b7 " +
          (t.remind === 0 ? "starting now" : "starts at " + fmtTime(new Date(dueMs))));
        t.notified = true; t.held = false; changed = true;
      } else { t.notified = true; changed = true; }
    }

    if (a.overdue && !muted && !quiet && !t.nudged && now >= dueMs + 900000 && now < dueMs + 86400000) {
      deliver("Still open \u00b7 " + t.title, "Overdue by " + Math.round((now - dueMs) / 60000) + " minutes");
      t.nudged = true; changed = true;
    }
  });


  if (changed) { save(); if (state.view !== "settings") renderScreen(true); }
}
setInterval(fireDue, 15000);
setInterval(() => { if (!document.querySelector(".sheet") && !state.drawer) renderScreen(true); }, 60000);

  };
  const pk = Object.keys(PRIORITIES);

  let rc = "";

  let reps = '<button class="qchip" data-rep="">Never</button>';

    '<div class="sheetscrim" id="sheetScrim"></div>' +
    '<div class="sheet glass" id="sheet">' +
      '<div class="grab"' + d(0) + '></div>' +
      '<div' + d(0) + ' style="display:flex;align-items:center;gap:10px">' +
        '<div class="title" style="flex:1;font-size:21px">' + (task ? "Edit task" : "New task") + '</div>' +
        '<button class="iconbtn" id="sheetClose" aria-label="Close">' + ico("x", 18) + '</button></div>' +
      '<div class="label"' + d(1) + '>Task</div>' +
      '<input class="field" id="fTitle"' + d(1) + ' placeholder="What needs to get done?" value="' + esc(draft.title) + '">' +
      '<div class="label"' + d(2) + '>Notes</div>' +
      '<textarea class="field" id="fNote"' + d(2) + ' placeholder="Details, links, context">' + esc(draft.note) + '</textarea>' +
      '<div class="label"' + d(3) + '>Priority</div>' +
      '<div class="segbar" id="segbar"' + d(3) + '>' + segs + '</div>' +
      '<div class="label"' + d(4) + '>Due</div>' +
      '<div class="chiprow" id="quickRow"' + d(4) + '>' + qc + '</div>' +
      '<div class="dtbar"' + d(5) + ' style="margin-top:8px">' +
        '<input class="dtin" id="fDate" type="date" aria-label="Due date" value="' + draft.due.slice(0, 10) + '">' +
        '<span class="dtsep"></span>' +
        '<input class="dtin" id="fTime" type="time" aria-label="Due time" value="' + draft.due.slice(11, 16) + '">' +
      '</div>' +
      '<div class="label"' + d(6) + '>Repeat</div>' +
      '<div class="chiprow" id="repRow"' + d(6) + '>' + reps + '</div>' +
      '<div class="label"' + d(7) + '>Steps</div>' +
      '<div id="stepList"' + d(7) + '></div>' +
      '<div class="qadd" id="stepAdd"' + d(7) + ' style="margin-top:8px">' +
        '<input id="stepIn" placeholder="Add a step" enterkeyhint="done">' +
        '<button class="qgo" id="stepGo" aria-label="Add step">' + ico("plus", 20, 2.6) + '</button></div>' +
      '<div class="collapse" id="remindWrap"><div>' +
        '<div class="label">Remind me</div><div class="chiprow" id="remindRow">' + rc + '</div>' +
        '<div style="font-size:12px;color:#8E8E97;margin:8px 6px 0" id="remindLabel"></div>' +
      '</div></div>' +
      '<div id="noDueHint" style="font-size:12px;color:#75757E;margin:10px 6px 0">Set a due time to turn on a reminder.</div>' +
      '<button class="primary" id="fSave">' + (task ? "Save changes" : "Add task") + '</button>' +
      (task ? '<button class="ghost" id="fDelete">Delete task</button>' : '') +
    '</div>';

  renderSteps();
  syncSheet();
  armSheetGesture();

  $("sheetScrim").addEventListener("click", closeSheet);
  $("sheetClose").addEventListener("click", closeSheet);
  $("fTitle").addEventListener("input", (e) => { draft.title = e.target.value; $("fSave").disabled = !draft.title.trim(); });
  $("fNote").addEventListener("input", (e) => { draft.note = e.target.value; });
  $("fDate").addEventListener("input", composeDue);
  $("fTime").addEventListener("input", composeDue);
  $("segbar").addEventListener("click", (e) => {
    const b = e.target.closest(".seg"); if (!b) return;
    draft.priority = b.dataset.p; syncSheet();
  });
  $("quickRow").addEventListener("click", (e) => {
    const b = e.target.closest(".qchip"); if (!b) return;
    if (b.dataset.q === "clear") draft.due = "";
    else { const dt = quicks[Number(b.dataset.q)].make(); dt.setSeconds(0, 0); draft.due = toLocalInput(dt.toISOString()); }
    syncSheet();
  });
  $("remindRow").addEventListener("click", (e) => {
    const b = e.target.closest(".qchip"); if (!b) return;
    draft.remind = Number(b.dataset.r); syncSheet();
  });
  $("repRow").addEventListener("click", (e) => {
    const b = e.target.closest(".qchip"); if (!b) return;
    draft.repeat = b.dataset.rep; syncSheet();
  });
  $("stepList").addEventListener("click", (e) => {
    const row = e.target.closest(".estep"); if (!row) return;
    const st = draft.steps.filter((x) => x.id === row.dataset.sid)[0]; if (!st) return;
    if (e.target.closest(".sdel")) draft.steps = draft.steps.filter((x) => x.id !== st.id);
    else st.done = !st.done;
    renderSteps();
  });
  $("stepGo").addEventListener("click", addStep);
  $("stepIn").addEventListener("keydown", (e) => { if (e.key === "Enter") addStep(); });
  $("fSave").addEventListener("click", commitSheet);
  if (task) $("fDelete").addEventListener("click", () => confirmDelete(task.id, closeSheet));
  if (!task) setTimeout(() => $("fTitle").focus(), 320);
}

function renderSteps() {
  const el = $("stepList");
  if (!el) return;
  el.innerHTML = draft.steps.length
    ? draft.steps.map((st) =>
        '<div class="estep' + (st.done ? " done" : "") + '" data-sid="' + st.id + '">' +
        '<button class="sbox2">' + (st.done ? ico("check", 12, 3.4) : "") + '</button>' +
        '<span class="etxt">' + esc(st.text) + '</span>' +
        '<button class="sdel" aria-label="Remove step">' + ico("x", 14) + '</button></div>').join("")
    : '<div class="qhint" style="margin:0 6px 2px">Break it into steps and tick them off as you go.</div>';
}

function addStep() {
  const i = $("stepIn");
  if (!i || !i.value.trim()) return;
  draft.steps.push({ id: uid(), text: i.value.trim(), done: false });
  i.value = "";
  renderSteps();
  i.focus();
}

function composeDue() {
  const dv = $("fDate").value, tv = $("fTime").value;
  if (!dv && !tv) draft.due = "";
  else {
    const today = toLocalInput(new Date().toISOString()).slice(0, 10);
    draft.due = (dv || today) + "T" + (tv || "09:00");
  }
  syncSheet();
}

function syncSheet() {
  const dEl = $("fDate"), tEl = $("fTime");
  if (dEl && dEl.value !== draft.due.slice(0, 10)) dEl.value = draft.due.slice(0, 10);
  if (tEl && tEl.value !== draft.due.slice(11, 16)) tEl.value = draft.due.slice(11, 16);
  const pk = Object.keys(PRIORITIES);
  const idx = pk.indexOf(draft.priority);
  $("segind").style.transform = "translateX(" + idx * 100 + "%)";
  document.querySelectorAll("#segbar .seg").forEach((b) => {
    const on = b.dataset.p === draft.priority;
    b.classList.toggle("on", on);
    b.querySelector(".pdot").style.opacity = on ? 1 : PRIORITIES[b.dataset.p].dot;
  });
  document.querySelectorAll("#quickRow .qchip").forEach((b) => {
    if (b.dataset.q === "clear") { b.style.display = draft.due ? "" : "none"; return; }
    const dt = quicks[Number(b.dataset.q)].make(); dt.setSeconds(0, 0);
    b.classList.toggle("on", draft.due === toLocalInput(dt.toISOString()));
  });
  document.querySelectorAll("#remindRow .qchip").forEach((b) => b.classList.toggle("on", Number(b.dataset.r) === draft.remind));
  document.querySelectorAll("#repRow .qchip").forEach((b) => b.classList.toggle("on", b.dataset.rep === draft.repeat));
  const lab = REMINDERS.filter((r) => r.v === draft.remind)[0];
  $("remindLabel").textContent = lab ? lab.label : "";
  $("remindWrap").classList.toggle("open", !!draft.due);
  $("noDueHint").style.display = draft.due ? "none" : "";
  $("fSave").disabled = !draft.title.trim();
}

function closeSheet() { $("sheetHost").innerHTML = ""; draft = null; }

/* drag the sheet down to dismiss it */
function armSheetGesture() {
  const sheet = $("sheet"), scrimEl = $("sheetScrim");
  let g = null;
  /* the entrance animation outranks inline styles, so retire it once it's done */
  const release = () => { sheet.style.animation = "none"; };
  sheet.addEventListener("animationend", release, { once: true });
  setTimeout(release, 560);

  sheet.addEventListener("touchstart", (e) => {
    if (sheet.scrollTop > 0) return;
    if (e.target.closest("input, textarea")) return;
    release();
    g = { y: e.touches[0].clientY, dy: 0, lock: null, last: e.touches[0].clientY, v: 0 };
  }, { passive: true });

  sheet.addEventListener("touchmove", (e) => {
    if (!g) return;
    const y = e.touches[0].clientY, dy = y - g.y;
    if (!g.lock) {
      if (dy > 9) g.lock = "y";
      else if (Math.abs(dy) > 9) { g = null; return; }
      else return;
    }
    g.v = y - g.last; g.last = y;
    g.dy = Math.max(0, dy);
    sheet.style.transition = "none";
    sheet.style.transform = "translateY(" + g.dy + "px)";
    scrimEl.style.transition = "none";
    scrimEl.style.opacity = String(Math.max(0, 1 - g.dy / 420));
  }, { passive: true });

  const finish = () => {
    if (!g) return;
    const d = g; g = null;
    if (d.lock !== "y") return;
    sheet.style.transition = "transform .42s cubic-bezier(.32,.72,0,1)";
    scrimEl.style.transition = "opacity .34s ease";
    if (d.dy > 120 || d.v > 6) {
      sheet.style.transform = "translateY(102%)";
      scrimEl.style.opacity = "0";
      setTimeout(closeSheet, 300);
    } else {
      sheet.style.transform = "translateY(0)";
      scrimEl.style.opacity = "1";
    }
  };
  sheet.addEventListener("touchend", finish, { passive: true });
  sheet.addEventListener("touchcancel", finish, { passive: true });
}

function commitSheet() {
  if (!draft.title.trim()) return;
  const data = {
    title: draft.title.trim(), note: draft.note.trim(),
    due: draft.due ? new Date(draft.due).toISOString() : "",
    priority: draft.priority, remind: Number(draft.remind),
    repeat: draft.repeat, steps: draft.steps
  };
  if (draft.id) state.tasks = state.tasks.map((t) => (t.id === draft.id ? Object.assign({}, t, data, { notified: false }) : t));
  else state.tasks = state.tasks.concat([Object.assign({ id: uid(), done: false, notified: false, created: Date.now() }, data)]);
  closeSheet(); save(); renderAll();
}

$("fab").innerHTML = ico("plus", 21, 2.4) + '<span class="flabel">New task</span>';
$("fab").addEventListener("click", () => openSheet(null));

let fabMini = false;
function syncFab() {
  const mini = scroller.scrollTop > 36;
  if (mini !== fabMini) { fabMini = mini; $("fab").classList.toggle("mini", mini); }
}
scroller.addEventListener("scroll", syncFab, { passive: true });

/* ================================================================== */
/*  boot                                                               */
/* ================================================================== */
settle(false, true);
applyPrefs();
renderAll();
renderQuick();
requestAnimationFrame(() => setQuick(false, true));
window.addEventListener("resize", () => { if (!quickOpen) setQuick(false, true); });
load();
</script>
